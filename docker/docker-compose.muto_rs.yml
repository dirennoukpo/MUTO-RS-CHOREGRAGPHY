##
## docker-compose.muto_rs.yml
## 
## Production deployment for MUTO-RS Robot (Raspberry Pi 5)
##
## Usage:
##   docker compose --env-file config/.env.muto_rs -f docker/docker-compose.muto_rs.yml up -d
##

services:
  muto-rs:
    image: ${MUTO_RS_IMAGE}:${IMAGE_ENV}
    container_name: muto-rs-orchestrator
    
    # Network configuration
    network_mode: host
    # Required for host network in compose
    privileged: true
    group_add:
      - "${MUTO_DIALOUT_GID:-20}"
    
    environment:
      - ROS_DISTRO=${ROS_DISTRO}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - PLATFORM=${PLATFORM}
      - MUTO_SERIAL_PORT=${MUTO_SERIAL_PORT:-/dev/ttyAMA0}
    
    # Hardware access for I2C/GPIO/Serial
    devices:
      - /dev/mem:/dev/mem
      - /dev/gpiomem:/dev/gpiomem
      - /dev/i2c-1:/dev/i2c-1
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/ttyAMA10:/dev/ttyAMA10
    
    # Data volumes
    volumes:
      - ./config/dds_config.xml:/etc/dds_config.xml:ro
      - muto_rs_data:/muto_rs_data
    
    # Resource limits (optional for Raspberry Pi)
    # mem_limit: 2g
    # cpus: '1.5'
    
    # Interactive terminal support (optional)
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    
    # Health check (optional)
    # healthcheck:
    #   test: ["CMD", "ros2", "node", "list"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s

volumes:
  muto_rs_data:
    driver: local
